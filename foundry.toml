[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true

# Remappings para importaciones
remappings = [
    "@openzeppelin/=lib/v4-core/lib/openzeppelin-contracts/",
    "ds-test/=lib/forge-std/lib/ds-test/src/",
    "forge-std/=lib/forge-std/src/",
    "v4-core/=lib/v4-core/src/",
]

# RPC Endpoints para diferentes redes
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
optimism_sepolia = "${OPTIMISM_SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
anvil = "http://localhost:8545"
mainnet = "https://eth.rpc.bloxroute.com"

# Etherscan API para verificación automática (opcional)
# Descomenta si necesitas verificar contratos

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
